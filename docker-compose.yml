services:
  eureka-server:
    image: guilhermejr/sistema-eureka-server
    container_name: eureka-server
    restart: always
    env_file: /home/guilhermejr/secrets/eureka-server.env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError
    ports:
      - "127.0.0.1:8761:8761"

networks:
  default:
    external: true
    name: rede